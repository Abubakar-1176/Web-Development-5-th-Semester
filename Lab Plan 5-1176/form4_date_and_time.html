<html>
<head>
<title>Date and time</title>
</head>
<body>
<form>
<fieldset>
<legend>Date and time</legend>

<fieldset>
<legend>Monday 21 October</legend>
<fieldset>
<legend>Morning</legend>
<input type="radio" name="t"> 9:30am
<input type="radio" name="t"> 10am
</fieldset>
<fieldset>
<legend>Afternoon</legend>
<input type="radio" name="t"> 4pm
</fieldset>
</fieldset>

<fieldset>
<legend>Tuesday 22 October</legend>
<fieldset>
<legend>Morning</legend>
<input type="radio" name="t"> 9:45am
<input type="radio" name="t"> 10am
</fieldset>
<fieldset>
<legend>Afternoon</legend>
<input type="radio" name="t"> 3:05pm
<input type="radio" name="t"> 3:15pm
</fieldset>
</fieldset>

<fieldset>
<legend>Wednesday 23 October</legend>
<fieldset>
<legend>Morning</legend>
<input type="radio" name="t"> 9:55am
</fieldset>
<fieldset>
<legend>Afternoon</legend>
<input type="radio" name="t" checked> 11:30pm
</fieldset>
</fieldset>

</fieldset>
</form>
</body>
</html>
