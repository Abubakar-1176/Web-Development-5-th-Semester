<html>
<head>
<title>User personal information</title>
</head>
<body>
<form>
<fieldset>
<legend><b>User personal information</b></legend>
<p>Enter your full name<br><input type="text" size="50"></p>
<p>Enter your email<br><input type="email" size="50"></p>
<p>Enter your password<br><input type="password" size="50"></p>
<p>Confirm your password<br><input type="password" size="50"></p>
<p>Enter your gender<br>
<input type="radio" name="g"> Male
<input type="radio" name="g"> Female
<input type="radio" name="g"> Others</p>
<p>Enter your Date of Birth<br><input type="date"></p>
<p>Enter your Address:<br><textarea rows="3" cols="50"></textarea></p>
<input type="submit" value="submit">
</fieldset>
</form>
</body>
</html>
