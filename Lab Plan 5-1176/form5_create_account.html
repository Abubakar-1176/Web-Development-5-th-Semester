<html>
<head>
<title>Create Account</title>
<style>
body{background:#527a8c;font-family:Arial}
h1{text-align:center;background:#eee;margin:0;padding:20px;color:#555}
td{vertical-align:top;padding:8px}
b{color:#1abc9c}
.btn{background:#1abc9c;color:white;border:0;padding:12px 25px;font-size:16px}
</style>
</head>
<body>
<form>
<table bgcolor="white" align="center" width="650">
<tr><td colspan="2" style="padding:0"><h1>Create Account</h1></td></tr>
<tr>
<td><b>First name *</b><br><input type="text" size="30" placeholder="enter your first name"></td>
<td><b>Last name</b><br><input type="text" size="30" placeholder="enter your last name"></td>
</tr>
<tr><td colspan="2"><b>Email*</b><br><input type="email" size="80" placeholder="enter your email"></td></tr>
<tr>
<td><b>Password *</b><br><input type="password" size="30" placeholder="enter your password"></td>
<td><b>Confirm Password *</b><br><input type="password" size="30" placeholder="enter your password again"></td>
</tr>
<tr>
<td><b>Gender:</b><br><input type="radio" name="g"> Male <input type="radio" name="g"> Female</td>
<td><b>Hobbies</b><br><input type="checkbox"> Music <input type="checkbox"> Sports <input type="checkbox"> Travel <input type="checkbox"> Movies</td>
</tr>
<tr>
<td><b>Source of Income</b><br>
<select>
<option>Employed</option>
<option>Self-employed</option>
<option>Student</option>
</select></td>
<td><b>Income</b><br><input type="range" min="20" max="200" value="20"> 20K</td>
</tr>
<tr>
<td><b>Upload Profile Picture</b><br><input type="file"></td>
<td><b>Age</b><br><input type="number" value="18"></td>
</tr>
<tr><td colspan="2"><b>Bio</b><br><textarea rows="6" cols="75"></textarea></td></tr>
<tr><td colspan="2" align="right" bgcolor="#eee"><input class="btn" type="submit" value="Create"></td></tr>
</table>
</form>
</body>
</html>
