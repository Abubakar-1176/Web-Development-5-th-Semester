<html>
<head>
<title>Student Registration Form</title>
</head>
<body>
<form>
<table bgcolor="mistyrose" cellpadding="10" align="center" width="700">
<tr><td colspan="2" align="center"><h1>Student Registration Form</h1></td></tr>
<tr><td>Roll no. :</td><td><input type="text" size="45"></td></tr>
<tr><td>Student name :</td><td><input type="text" placeholder="First Name"> - <input type="text" placeholder="Last Name"></td></tr>
<tr><td>Father's name :</td><td><input type="text" size="45"></td></tr>
<tr><td>Date of birth :</td><td><input type="text" size="4" placeholder="Day"> - <input type="text" size="6" placeholder="Month"> - <input type="text" size="6" placeholder="Year"> <i>(DD-MM-YYYY)</i></td></tr>
<tr><td>Mobile no. :</td><td><input type="text" size="3" value="+91"> - <input type="text" size="35"></td></tr>
<tr><td>Email id :</td><td><input type="email" size="45"></td></tr>
<tr><td>Password :</td><td><input type="password" size="45"></td></tr>
<tr><td>Gender :</td><td><input type="radio" name="g"> Male <input type="radio" name="g"> Female</td></tr>
<tr><td>Department :</td><td><input type="checkbox"> CSE <input type="checkbox"> IT <input type="checkbox"> ECE <input type="checkbox"> Civil <input type="checkbox"> Mech</td></tr>
<tr><td>Course :</td><td>
<select>
<option>---------------------- Select Current Course's ------------------------</option>
<option>B.Tech</option>
<option>M.Tech</option>
<option>BCA</option>
<option>MCA</option>
</select>
</td></tr>
<tr><td>Student photo :</td><td><input type="file"></td></tr>
<tr><td>City :</td><td><input type="text" size="45"></td></tr>
<tr><td>Address :</td><td><textarea rows="6" cols="43"></textarea></td></tr>
<tr><td colspan="2" align="center"><input type="submit" value="Register"></td></tr>
</table>
</form>
</body>
</html>
