<!DOCTYPE html>
<html>
<head>
    <title>Scrolling Text</title>
</head>
<body>
<h3>Scroll</h3>
<marquee behavior="scroll" loop="5">
    Muhammad Abubakar
</marquee>

<h3>Slide</h3>
<marquee behavior="slide" loop="5">
    Muhammad Abubakar
</marquee>

<h3>Alternate</h3>
<marquee behavior="alternate" loop="5">
    Muhammad Abubakar
</marquee>

</body>
</html>
