<!DOCTYPE html>
<html>
<head>
    <title>Formatting Text</title>
</head>
<body>
    <h2>Formatting Text</h2><br>
    Font size -7 :
    <font size="7">HTML</font><br>
    Font size -3 :
    <font size="3">HTML</font><br>
    Font color - red :
    <font color="red">HTML</font><br>
    Font size -6 and color - red :
    <font size="6" color="red">HTML</font><br>
    Bold, underline and italic :
    <b><u><i>Text</i></u></b> Bold :
    <b>HTML</b><br> Strong :
    <strong>HTML</strong><br> Underline :
    <u>HTML</u><br>Ins :
    <ins>HTML</ins><br> Italic :
    <i>HTML</i>Emphasis :
    <em>HTML</em><br> Strike :
    <strike>HTML</strike><br> Del :
    <del>HTML</del><br>
    Highlighting a text :
    <mark>HTML</mark>
</body>
</html>
