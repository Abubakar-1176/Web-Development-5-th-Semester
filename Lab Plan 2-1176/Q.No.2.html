<!doctype html>
<html >
<head>
    <title>Document</title>
</head>
<body>
    <p>
        <b>This text is bold</b> <br>
        <i>This is an italic text</i> <br>
        <u>This text is underlined</u> <br>
        <strong>This is strong text</strong> <br>
        <em>This is emphasized (important) text</em>  <br>
        <small>This is small sized text</small>
        <h3>This is big (large) text</h3>
        <del>This shows deleted text</del> <br>
        <ins>This shows inserted text</ins> <br>
        <sub>Sub-scripted text</sub> <br>
        <sup>Super-scripted text</sup> <br>
        <mark>This text is marked(highlighted)</mark>
    </p>
</body>
</html
