<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title> Q18 Form with image</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#d2c8c3;font-family:Arial,sans-serif}
.wrap{display:flex;max-width:950px;width:95%;flex-wrap:wrap;align-items:center}
.img{flex:1.1;min-width:280px;min-height:400px;background:#334 url('laptop.jpg') center/cover}
form{flex:1;min-width:280px;padding:25px}.row{display:flex;gap:20px}.row div{flex:1}
label{font-weight:bold;font-size:14px}input,textarea{width:100%;border:0;border-bottom:1px solid #888;background:#fff;padding:10px;margin:5px 0 18px}textarea{height:90px}
button{width:100%;background:#f97b3d;color:#fff;border:0;border-radius:30px;padding:14px;font-weight:bold;margin-top:10px}.cr{text-align:center;font-size:13px;margin-top:20px}
</style></head><body><div class="wrap"><div class="img"></div>
<form><div class="row"><div><label>Email</label><input placeholder="Enter a valid email"></div><div><label>Name</label><input placeholder="Enter your Name"></div></div>
<label>Address</label><input placeholder="Enter your address"><label>Message</label><textarea placeholder="Enter your message"></textarea>
<button>SUBMIT</button><div class="cr">Images from <a href="https://www.freepik.com">Freepik</a></div></form></div></body></html>
