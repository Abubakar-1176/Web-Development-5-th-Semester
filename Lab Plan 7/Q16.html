<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABC Hotel Booking Form</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f2f4f6;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }
    .booking-container {
        background-color: #fff;
        padding: 30px 35px;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(0,0,0,0.2);
        width: 500px;
    }
    h2 {
        text-align: center;
        color: #333;
        margin-bottom: 20px;
    }
    table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 10px;
    }
    td {
        padding: 5px 0;
    }
    input[type="text"],
    input[type="email"],
    input[type="date"],
    input[type="number"],
    select {
        width: 100%;
        padding: 8px;
        border-radius: 5px;
        border: 1px solid #ccc;
        box-sizing: border-box;
    }
    input[type="submit"] {
        margin-top: 20px;
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 5px;
        background-color: #28a745;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s;
    }
    input[type="submit"]:hover {
        background-color: #218838;
    }
</style>
</head>
<body>
<div class="booking-container">
    <h2>ABC Hotel Booking</h2>
    <form>
        <table>
            <tr>
                <td><label for="name">Guest Name:</label></td>
                <td><input type="text" id="name" name="name" placeholder="Enter your name" required></td>
            </tr>
            <tr>
                <td><label for="email">Email:</label></td>
                <td><input type="email" id="email" name="email" placeholder="Enter your email" required></td>
            </tr>
            <tr>
                <td><label for="room">Room Type:</label></td>
                <td>
                    <select id="room" name="room" required>
                        <option value="" disabled selected>Select room type</option>
                        <option value="single">Single</option>
                        <option value="double">Double</option>
                        <option value="suite">Suite</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="checkin">Check-in Date:</label></td>
                <td><input type="date" id="checkin" name="checkin" required></td>
            </tr>
            <tr>
                <td><label for="checkout">Check-out Date:</label></td>
                <td><input type="date" id="checkout" name="checkout" required></td>
            </tr>
            <tr>
                <td><label for="guests">Number of Guests:</label></td>
                <td><input type="number" id="guests" name="guests" min="1" placeholder="Enter number of guests" required></td>
            </tr>
        </table>
        <input type="submit" value="Book Now">
    </form>
</div>
</body>
</html>
