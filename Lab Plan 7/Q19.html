<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title> Q19 Login & Signup</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#4070f4;display:flex;gap:20px;justify-content:center;align-items:center;font-family:Poppins,Arial,sans-serif;flex-wrap:wrap;padding:20px}
.card{background:#fff;width:300px;padding:25px 18px;border-radius:8px;text-align:center;font-size:12px}.card h2{margin:0 0 20px}
input{width:100%;padding:11px;border:1px solid #ddd;border-radius:5px;margin-bottom:12px}
.main{width:100%;background:#0171d3;color:#fff;border:0;padding:11px;border-radius:5px;margin:8px 0 12px}
a{color:#0171d3;text-decoration:none}.or{margin:14px 0;color:#888;display:flex;align-items:center;gap:8px}.or:before,.or:after{content:"";flex:1;border-top:1px solid #ddd}
.fb{width:100%;background:#4267b2;color:#fff;border:0;padding:11px;border-radius:5px;margin-bottom:10px}.gg{width:100%;background:#fff;border:1px solid #ddd;padding:11px;border-radius:5px}
</style></head><body>
<div class="card"><h2>Login</h2><input placeholder="Email"><input type="password" placeholder="Password"><a href="#">Forgot password?</a>
<button class="main">Login</button><div>Don't have an account? <a href="#">Signup</a></div><div class="or">Or</div>
<button class="fb">Login with Facebook</button><button class="gg">G &nbsp; Login with Google</button></div>
<div class="card"><h2>Signup</h2><input placeholder="Email"><input type="password" placeholder="Create password"><input type="password" placeholder="Confirm password">
<button class="main">Signup</button><div>Already have an account? <a href="#">Login</a></div><div class="or">Or</div>
<button class="fb">Login with Facebook</button><button class="gg">G &nbsp; Login with Google</button></div></body></html>
