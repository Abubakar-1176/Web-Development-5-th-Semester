<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title> Q17 ABC Company</title><style>
*{box-sizing:border-box}body{margin:0;background:#ff3b4a;font-family:Arial,sans-serif;padding:30px}
.page{background:#fff;max-width:760px;margin:auto;padding:15px}
.hero{height:230px;background:linear-gradient(120deg,#2a2018,#8fb4d4 60%,#2a2018) center/cover url('building.jpg')}
.cities{display:flex;justify-content:space-around;padding:20px 0;font-weight:bold}
.grid{display:flex;gap:20px;flex-wrap:wrap}.grid>*{flex:1;min-width:280px}
h1{font-weight:300;text-align:center;margin:30px 0}label{font-size:13px}
input,textarea{width:100%;background:#e4e4e4;border:1px solid #ccc;border-radius:4px;padding:10px;margin:5px 0 16px}textarea{height:90px}
button{width:100%;background:#ff3b4a;color:#fff;border:0;padding:12px;border-radius:4px;font-weight:bold}iframe{width:100%;height:100%;min-height:380px;border:0}
</style></head><body><div class="page"><div class="hero"></div>
<div class="cities"><span>Sydney</span><span>Melbourne</span><span>Los Angeles</span><span>London</span></div>
<div class="grid"><form><h1>Get in Touch</h1><label>Name</label><input placeholder="Enter your Name">
<label>Email</label><input type="email" placeholder="Enter a valid email address"><label>How can we help?</label><textarea></textarea><button>SUBMIT</button></form>
<iframe src="https://maps.google.com/maps?q=Manhattan,New+York&output=embed" loading="lazy"></iframe></div></div></body></html>
