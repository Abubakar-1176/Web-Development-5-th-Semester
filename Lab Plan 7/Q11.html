<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title> Q11 Contact Us</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff;padding:24px}
.top{display:flex;gap:30px;max-width:1000px;margin:auto;flex-wrap:wrap}
.pic{flex:1;min-width:280px;min-height:380px;background:#e6e6e6 url('photo.jpg') center/cover;display:flex;align-items:center;justify-content:center;color:#999}
form{flex:1;min-width:280px}h1{font-weight:300;text-align:center;font-size:40px;margin:0 0 15px}
label{font-size:13px}input[type=text],input[type=email],textarea{width:100%;border:0;border-bottom:1px solid #aaa;padding:8px 0;margin-bottom:14px;outline:0}
textarea{height:110px;resize:vertical}.btn{width:100%;background:#e21f26;color:#fff;border:0;padding:14px;border-radius:4px;font-weight:bold;margin-top:10px;cursor:pointer}
.cards{display:flex;gap:12px;max-width:1000px;margin:24px auto 0;flex-wrap:wrap}
.card{flex:1;min-width:220px;background:#e21f26;color:#fff;padding:20px;font-size:13px}.card h3{margin:0 0 10px;font-size:16px}
</style></head><body>
<div class="top"><div class="pic">Put your photo here (photo.jpg)</div>
<form><h1>Contact Us</h1>
<label>Name</label><input type="text" placeholder="Enter your Name">
<label>Email</label><input type="email" placeholder="Enter a valid email address">
<label>Message</label><textarea></textarea>
<label><input type="checkbox"> I accept the <a href="#">Terms of Service</a></label>
<button class="btn">SUBMIT</button></form></div>
<div class="cards">
<div class="card"><h3>&#9990; CALL US</h3>1 (234) 567-891,<br>1 (234) 987-654</div>
<div class="card"><h3>&#9906; LOCATION</h3>121 Rock Street, 21 Avenue, New York, NY 92103-9000</div>
<div class="card"><h3>&#9201; HOURS</h3>Mon - Fri ...... 11 am - 8 pm, Sat, Sun ...... 6 am - 8 pm</div></div>
</body></html>
