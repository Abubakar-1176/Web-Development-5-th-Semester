<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title> Q14 Sign in / Sign up</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fbc02d;display:flex;gap:30px;justify-content:center;align-items:flex-start;padding:30px;flex-wrap:wrap}
.box{background:#ddd;padding:12px;width:330px}.card{background:#fff;padding:22px;border-radius:4px;box-shadow:0 1px 4px #0004}
.logo{width:120px;margin:0 auto 18px;border:2px dashed #f4b400;color:#f4b400;text-align:center;padding:12px 0;font-variant:small-caps;font-weight:bold}
label{font-size:12px;color:#777;display:block;margin-top:10px}label b{color:red}
input{width:100%;padding:8px;border:1px solid #f9d24a;border-radius:3px;margin-top:4px}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:16px}.row a{font-size:12px;color:#f4b400;display:block;text-decoration:none}
button{background:#fbc02d;border:0;color:#fff;padding:9px 28px;border-radius:3px;box-shadow:0 1px 3px #0003;cursor:pointer}
</style></head><body>
<div class="box"><div class="card"><div class="logo">Your Logo Here</div>
<label>First name<b>*</b></label><input><label>Last name<b>*</b></label><input>
<label>Email address<b>*</b></label><input type="email"><label>Password<b>*</b></label><input type="password">
<label>Again password<b>*</b></label><input type="password">
<div class="row"><a href="#">Have an account</a><button>Signup</button></div></div></div>
<div class="box"><div class="card"><div class="logo">Your Logo Here</div>
<label>Username or email address<b>*</b></label><input><label>Password<b>*</b></label><input type="password">
<div class="row"><div><a href="#">Forgot password?</a><a href="#">Create an account</a></div><button>Login</button></div></div></div>
</body></html>
