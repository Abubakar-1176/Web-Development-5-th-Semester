<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Management Form</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f8;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }
    .project-form {
        background-color: #fff;
        padding: 35px 40px;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(0,0,0,0.2);
        width: 450px;
    }
    h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #222;
    }
    label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
        color: #555;
    }
    input[type="text"],
    input[type="date"],
    select,
    textarea {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border-radius: 5px;
        border: 1px solid #ccc;
        box-sizing: border-box;
    }
    textarea {
        resize: vertical;
        min-height: 70px;
    }
    input[type="submit"] {
        margin-top: 20px;
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 5px;
        background-color: #17a2b8;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }
    input[type="submit"]:hover {
        background-color: #138496;
    }
</style>
</head>
<body>
<div class="project-form">
    <h2>Project Management Form</h2>
    <form>
        <label for="projectName">Project Name:</label>
        <input type="text" id="projectName" name="projectName" placeholder="Enter project name" required>

        <label for="projectId">Project ID:</label>
        <input type="text" id="projectId" name="projectId" placeholder="Enter project ID" required>

        <label for="startDate">Start Date:</label>
        <input type="date" id="startDate" name="startDate" required>

        <label for="endDate">End Date:</label>
        <input type="date" id="endDate" name="endDate" required>

        <label for="assignedTo">Assigned To:</label>
        <input type="text" id="assignedTo" name="assignedTo" placeholder="Team member name" required>

        <label for="status">Status:</label>
        <select id="status" name="status" required>
            <option value="" disabled selected>Select status</option>
            <option value="not-started">Not Started</option>
            <option value="in-progress">In Progress</option>
            <option value="completed">Completed</option>
        </select>

        <label for="priority">Priority:</label>
        <select id="priority" name="priority" required>
            <option value="" disabled selected>Select priority</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
        </select>

        <label for="description">Description:</label>
        <textarea id="description" name="description" placeholder="Enter project description"></textarea>

        <input type="submit" value="Submit Project">
    </form>
</div>
</body>
</html>
