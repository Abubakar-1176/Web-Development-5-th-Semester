<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Application Form</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f0f2f5;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .form-container {
        background-color: #fff;
        padding: 25px 35px;
        border-radius: 10px;
        box-shadow: 0px 0px 15px rgba(0,0,0,0.2);
        width: 400px;
    }
    h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
    }
    label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
        color: #555;
    }
    input[type="text"],
    input[type="email"],
    input[type="number"],
    input[type="date"],
    input[type="password"],
    select {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border-radius: 5px;
        border: 1px solid #ccc;
        box-sizing: border-box;
    }
    input[type="radio"] {
        margin-right: 5px;
    }
    input[type="submit"] {
        margin-top: 20px;
        width: 100%;
        padding: 10px;
        border: none;
        background-color: #4CAF50;
        color: white;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
    }
    input[type="submit"]:hover {
        background-color: #45a049;
    }
</style>
</head>
<body>
<div class="form-container">
    <h2>Application Form</h2>
    <form>
        <label for="fname">First Name:</label>
        <input type="text" id="fname" name="fname" value="Soha" required>

        <label for="lname">Last Name:</label>
        <input type="text" id="lname" name="lname" value="Sajjal" required>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" value="20" required>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" value="2006-02-16" required>

        <label>Gender:</label>
        <input type="radio" id="female" name="gender" value="female" checked>
        <label for="female" style="display:inline;">Female</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male" style="display:inline;">Male</label>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" value="abubakarzafar@gmail.com" required>

        <label for="position">Position Available:</label>
        <select id="position" name="position">
            <option value="mid lvl developer" selected>Mid lvl developer</option>
            <option value="junior developer">Junior developer</option>
            <option value="senior developer">Senior developer</option>
        </select>

        <label for="language">Programming Language:</label>
        <select id="language" name="language">
            <option value="javascript" selected>JavaScript</option>
            <option value="python">Python</option>
            <option value="java">Java</option>
            <option value="c++">C++</option>
        </select>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" value="1234" required>

        <input type="submit" value="Submit">
    </form>
</div>
</body>
</html>
