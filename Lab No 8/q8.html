<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q8 - Form</title>
  <link href="./src/output.css" rel="stylesheet">
</head>
<body class="bg-white p-6">
  <div class="mx-auto grid max-w-4xl items-center bg-stone-300 md:grid-cols-2">
    <img src="https://picsum.photos/seed/laptop8/700/550" alt="Devices" class="h-full w-full object-cover">

    <form class="p-8">
      <div class="mb-6 grid grid-cols-2 gap-6">
        <div>
          <label class="text-sm font-bold">Email</label>
          <input type="email" placeholder="Enter a valid email address" class="mt-1 block w-full border-b border-gray-400 bg-white px-2 py-2 text-xs outline-none">
        </div>
        <div>
          <label class="text-sm font-bold">Name</label>
          <input type="text" placeholder="Enter your Name" class="mt-1 block w-full border-b border-gray-400 bg-white px-2 py-2 text-xs outline-none">
        </div>
      </div>
      <label class="text-sm font-bold">Address</label>
      <input type="text" placeholder="Enter your address" class="mb-6 mt-1 block w-full border-b border-gray-400 bg-white px-2 py-2 text-xs outline-none">
      <label class="text-sm font-bold">Message</label>
      <textarea rows="4" placeholder="Enter your message" class="mb-6 mt-1 block w-full border-b border-gray-400 bg-white px-2 py-2 text-xs outline-none"></textarea>
      <button type="submit" class="w-full rounded-full bg-orange-500 py-3 text-sm font-bold text-white">SUBMIT</button>
      <p class="mt-8 text-center text-xs">Images from <a href="https://www.freepik.com" class="border-b border-black">Freepik</a></p>
    </form>
  </div>
</body>
</html>
