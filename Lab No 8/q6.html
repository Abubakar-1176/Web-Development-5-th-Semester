<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q6 - ABC Hotel Book a Table</title>
  <link href="./src/output.css" rel="stylesheet">
</head>
<body class="bg-white p-6">
  <div class="mx-auto grid max-w-4xl items-center gap-6 md:grid-cols-2">

    
    <div class="relative h-96 overflow-hidden">
      <div class="absolute -left-10 -top-10 h-72 w-80 rounded-[50%_50%_60%_40%] bg-orange-500"></div>
      <div class="absolute -bottom-10 left-20 h-72 w-72 rounded-full bg-orange-500"></div>
      <img src="https://picsum.photos/seed/food6/400/400" alt="Food" class="absolute -left-16 top-4 h-80 w-80 rounded-full object-cover shadow-xl">
    </div>

    <!-- form -->
    <form class="rounded-[2rem] bg-gray-100 p-6">
      <h2 class="mb-5 text-3xl font-light">Book your table</h2>
      <div class="mb-3 grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs">Phone</label>
          <input type="tel" placeholder="Enter your phone (e.g. +14155552675)" class="mt-1 block w-full rounded-full bg-white px-3 py-2 text-xs outline-none">
        </div>
        <div>
          <label class="text-xs">Name</label>
          <input type="text" placeholder="Enter your Name" class="mt-1 block w-full rounded-full bg-white px-3 py-2 text-xs outline-none">
        </div>
      </div>
      <label class="text-xs">Date</label>
      <input type="date" class="mb-3 mt-1 block w-full rounded-full bg-white px-3 py-2 text-xs text-gray-500 outline-none">
      <label class="text-xs">Message</label>
      <textarea rows="4" placeholder="Enter your message" class="mb-4 mt-1 block w-full rounded-2xl bg-white px-3 py-2 text-xs outline-none"></textarea>
      <button type="submit" class="rounded-full bg-sky-400 px-6 py-2 text-xs font-bold text-white">SUBMIT</button>
    </form>
  </div>
</body>
</html>
