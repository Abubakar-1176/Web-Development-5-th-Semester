<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q1 - Contact Form</title>
  <link href="./src/output.css" rel="stylesheet">
</head>
<body class="bg-white p-6">
  <div class="relative mx-auto flex min-h-[460px] max-w-5xl bg-black text-white">
    
    <div class="absolute inset-y-0 left-[36%] w-[28%] bg-brand-yellow"></div>

    
    <div class="relative z-10 flex w-[36%] flex-col justify-between p-12">
      <div>
        <h2 class="mb-6 text-lg tracking-[0.25em]">LOCATION</h2>
        <p class="text-sm leading-6">28 Jackson Blvd Ste 1020 Chicago<br>IL 60604-2340</p>
      </div>
      <div>
        <h2 class="mb-4 text-lg tracking-[0.25em]">FOLLOW US</h2>
        <div class="mb-6 flex gap-3">
          <a href="https://www.facebook.com" target="_blank" class="flex h-7 w-7 items-center justify-center rounded-full bg-white text-sm font-bold text-black">f</a>
          <a href="https://www.twitter.com" target="_blank" class="flex h-7 w-7 items-center justify-center rounded-full bg-white text-sm font-bold text-black">t</a>
          <a href="https://www.instagram.com" target="_blank" class="flex h-7 w-7 items-center justify-center rounded-full bg-white text-xs font-bold text-black">ig</a>
          <a href="https://plus.google.com" target="_blank" class="flex h-7 w-7 items-center justify-center rounded-full bg-white text-[10px] font-bold text-black">G+</a>
        </div>
        <p class="text-sm">&copy;2018 Privacy policy</p>
      </div>
    </div>
    <form class="relative z-10 flex-1 p-10 pt-12">
      <h2 class="mb-6 text-3xl tracking-widest">CONTACT FORM</h2>
      <input type="text" placeholder="Enter your Name" class="mb-4 block w-[92%] bg-gray-100 px-3 py-2 text-sm text-black outline-none">
      <input type="email" placeholder="Enter a valid email address" class="mb-4 block w-[92%] bg-gray-100 px-3 py-2 text-sm text-black outline-none">
      <textarea rows="4" placeholder="Enter your message" class="mb-5 block w-[92%] bg-gray-100 px-3 py-2 text-sm text-black outline-none"></textarea>
      <button type="submit" class="border border-white px-8 py-2 text-xs tracking-[0.3em] hover:bg-white hover:text-black">SUBMIT</button>
    </form>
  </div>
</body>
</html>
