<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q9 - Login / Signup</title>
  <link href="./src/output.css" rel="stylesheet">
</head>
<body class="bg-white p-6">
  <div class="mx-auto flex max-w-4xl flex-col items-center justify-center gap-5 bg-blue-500 px-6 py-14 md:flex-row md:items-center">

    <!-- Login -->
    <form class="w-full max-w-xs rounded-lg bg-white p-5 shadow">
      <h2 class="mb-4 text-center text-xl font-semibold">Login</h2>
      <input type="email" placeholder="Email" class="mb-3 block w-full rounded border border-gray-300 px-3 py-2 text-xs outline-none">
      <div class="relative mb-2">
        <input type="password" id="lp" placeholder="Password" class="block w-full rounded border border-gray-300 px-3 py-2 text-xs outline-none">
        <button type="button" onclick="toggle('lp')" class="absolute right-3 top-1.5 text-gray-400">&#128065;</button>
      </div>
      <a href="#" class="mb-3 block text-center text-xs text-blue-600">Forgot password?</a>
      <button type="submit" class="w-full rounded bg-blue-600 py-2 text-xs text-white">Login</button>
      <p class="mt-3 text-center text-xs">Don't have an account? <a href="#" class="text-blue-600">Signup</a></p>
      <div class="my-3 flex items-center gap-2 text-xs text-gray-400"><span class="h-px flex-1 bg-gray-300"></span>Or<span class="h-px flex-1 bg-gray-300"></span></div>
      <button type="button" class="mb-2 flex w-full items-center gap-3 rounded bg-indigo-700 px-3 py-2 text-xs text-white"><span class="flex h-5 w-5 items-center justify-center rounded-full bg-white text-xs font-bold text-indigo-700">f</span><span class="flex-1">Login with Facebook</span></button>
      <button type="button" class="flex w-full items-center gap-3 rounded border border-gray-300 px-3 py-2 text-xs text-gray-500"><span class="font-bold text-blue-500">G</span><span class="flex-1">Login with Google</span></button>
    </form>

    <!-- Signup -->
    <form class="w-full max-w-xs rounded-lg bg-white p-5 shadow md:mt-6">
      <h2 class="mb-4 text-center text-xl font-semibold">Signup</h2>
      <input type="email" placeholder="Email" class="mb-3 block w-full rounded border border-gray-300 px-3 py-2 text-xs outline-none">
      <input type="password" placeholder="Create password" class="mb-3 block w-full rounded border border-gray-300 px-3 py-2 text-xs outline-none">
      <div class="relative mb-3">
        <input type="password" id="sp" placeholder="Confirm password" class="block w-full rounded border border-gray-300 px-3 py-2 text-xs outline-none">
        <button type="button" onclick="toggle('sp')" class="absolute right-3 top-1.5 text-gray-400">&#128065;</button>
      </div>
      <button type="submit" class="w-full rounded bg-blue-600 py-2 text-xs text-white">Signup</button>
      <p class="mt-3 text-center text-xs">Already have an account? <a href="#" class="text-blue-600">Login</a></p>
      <div class="my-3 flex items-center gap-2 text-xs text-gray-400"><span class="h-px flex-1 bg-gray-300"></span>Or<span class="h-px flex-1 bg-gray-300"></span></div>
      <button type="button" class="mb-2 flex w-full items-center gap-3 rounded bg-indigo-700 px-3 py-2 text-xs text-white"><span class="flex h-5 w-5 items-center justify-center rounded-full bg-white text-xs font-bold text-indigo-700">f</span><span class="flex-1">Login with Facebook</span></button>
      <button type="button" class="flex w-full items-center gap-3 rounded border border-gray-300 px-3 py-2 text-xs text-gray-500"><span class="font-bold text-blue-500">G</span><span class="flex-1">Login with Google</span></button>
    </form>
  </div>

  <script>
    function toggle(id) {
      const el = document.getElementById(id);
      el.type = el.type === "password" ? "text" : "password";
    }
  </script>
</body>
</html>
